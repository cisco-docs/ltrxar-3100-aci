---
# Tenant PROD — full multidomain-aware definition.
#
# This tenant owns the entire ACI side of the PROD multidomain handoff:
#   - VRF PROD
#   - 6 bridge domains BD_VLAN30..35 (192.168.10-15.0/24), public:true,
#     associated with L3OUT-SDWAN-PROD for advertisement
#   - Contract CT-PROD-PERMIT-ANY (wide-open lab policy)
#   - L3OUT-SDWAN-PROD on border leaf node 403, eth1/1 sub-interface VLAN 3010,
#     IP 10.100.10.1/30, EBGP peer 10.100.10.2 remote-as 65200 local-as 65100
#   - External EPG EXT-EPG-PROD with 0.0.0.0/0 and aggregate import/export
#   - Application profile PROD with EPG_VLAN30..35, all consuming/providing
#     CT-PROD-PERMIT-ANY (so internal endpoints can reach external via L3Out)
#
# Soft references: at this layer node 403 is not yet registered (lives in
# multi-domain/aci/). APIC will raise faults on the L3Out's node profile
# (l3extRsNodeL3OutAtt) and path bindings (l3extRsPathL3OutAtt) until the
# multi-domain layer registers the node and binds eth1/1 to 10G-ROUTED.
# The tenant itself is fully operational; only the L3Out advertisement waits.
apic:
  tenants:
    - name: PROD

      vrfs:
        - name: PROD

      bridge_domains:
        - name: BD_VLAN30
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.10.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD_VLAN31
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.11.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD_VLAN32
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.12.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD_VLAN33
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.13.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD_VLAN34
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.14.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD_VLAN35
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.15.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

      contracts:
        - name: CT-PROD-PERMIT-ANY
          scope: context
          subjects:
            - name: SUBJ-PERMIT-ANY
              filters:
                - filter: default
                  action: permit

      l3outs:
        - name: L3OUT-SDWAN-PROD
          vrf: PROD
          domain: ROUTED1
          bgp: {}
          import_route_control_enforcement: true
          export_route_control_enforcement: true
          nodes:
            - node_id: 403
              router_id: 10.255.100.3
              interfaces:
                - port: 1
                  vlan: 3010
                  ip: 10.100.10.1/30
                  bgp_peers:
                    - ip: 10.100.10.2
                      remote_as: 65200
                      local_as: 65100
                      admin_state: true
                      unicast_address_family: true
                      send_community: true
                      send_ext_community: true
          external_endpoint_groups:
            - name: EXT-EPG-PROD
              subnets:
                - prefix: 0.0.0.0/0
                  import_route_control: true
                  export_route_control: true
                  aggregate_import_route_control: true
                  aggregate_export_route_control: true
                  import_security: true
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

      application_profiles:
        - name: PROD
          endpoint_groups:
            - name: EPG_VLAN30
              bridge_domain: BD_VLAN30
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY
              static_ports:
                - node_id: 401
                  port: 3
                  vlan: 30

            - name: EPG_VLAN31
              bridge_domain: BD_VLAN31
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

            - name: EPG_VLAN32
              bridge_domain: BD_VLAN32
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

            - name: EPG_VLAN33
              bridge_domain: BD_VLAN33
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

            - name: EPG_VLAN34
              bridge_domain: BD_VLAN34
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

            - name: EPG_VLAN35
              bridge_domain: BD_VLAN35
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY
