---
# Tenant PROD — collapsed to 2 EPGs (EPG-Servers, EPG-Web) per the
# multi-domain/design.md §3 mapping. ACI is narrative-only in this lab
# (sim has no data plane); the L3Out is configured against LEAF102 but
# the BGP peer will sit Idle since there is no physical wire on the
# SDWAN side. APIC will raise a fault for the down peer — expected.
#
# L3OUT-SDWAN-PROD: LEAF102 eth1/1 sub-interface VLAN 3010,
#   IP 10.100.10.1/30, EBGP peer 10.100.10.2 remote-as 65200 local-as 65100.
apic:
  tenants:
    - name: PROD

      vrfs:
        - name: PROD

      bridge_domains:
        - name: BD-Servers
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.10.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

        - name: BD-Web
          vrf: PROD
          unicast_routing: true
          subnets:
            - ip: 192.168.11.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-PROD

      contracts:
        - name: CT-PROD-PERMIT-ANY
          scope: context
          subjects:
            - name: SUBJ-PERMIT-ANY
              filters:
                - filter: default
                  action: permit

      l3outs:
        - name: L3OUT-SDWAN-PROD
          vrf: PROD
          domain: ROUTED1
          bgp: {}
          import_route_control_enforcement: true
          export_route_control_enforcement: true
          nodes:
            - node_id: 102
              router_id: 10.255.100.102
              interfaces:
                - port: 1
                  vlan: 3010
                  ip: 10.100.10.1/30
                  bgp_peers:
                    - ip: 10.100.10.2
                      remote_as: 65200
                      local_as: 65100
                      admin_state: true
                      unicast_address_family: true
                      send_community: true
                      send_ext_community: true
          external_endpoint_groups:
            - name: EXT-EPG-PROD
              subnets:
                - prefix: 0.0.0.0/0
                  import_route_control: true
                  export_route_control: true
                  aggregate_import_route_control: true
                  aggregate_export_route_control: true
                  import_security: true
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY

      application_profiles:
        - name: PROD
          endpoint_groups:
            - name: EPG-Servers
              bridge_domain: BD-Servers
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY
              static_ports:
                - node_id: 101
                  port: 3
                  vlan: 30

            - name: EPG-Web
              bridge_domain: BD-Web
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-PROD-PERMIT-ANY
                providers:
                  - CT-PROD-PERMIT-ANY
