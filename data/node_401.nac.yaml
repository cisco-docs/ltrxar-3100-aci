          - port: 2
            policy_group: 10G-ACCESS
          - port: 3
            policy_group: 10G-ACCESS
          - port: 4
            policy_group: 10G-VPC
          - port: 5
            policy_group: 10G-VPC
          - port: 6
            policy_group: 10G-VPC
