---
# Tenant SVCS — collapsed to 2 EPGs (EPG-Shared, EPG-DB). Mirror of tenant_PROD with SVCS values.
# Both L3Outs share LEAF102 eth1/1 via dot1q sub-interfaces (3010 PROD,
# 3020 SVCS). BGP peer on SVCS L3Out also Idle — no physical wire.
#
# L3OUT-SDWAN-SVCS: LEAF102 eth1/1 sub-interface VLAN 3020,
#   IP 10.100.20.1/30, EBGP peer 10.100.20.2 remote-as 65200 local-as 65100.
apic:
  tenants:
    - name: SVCS

      vrfs:
        - name: SVCS

      bridge_domains:
        - name: BD-Shared
          vrf: SVCS
          unicast_routing: true
          subnets:
            - ip: 192.168.20.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-SVCS

        - name: BD-DB
          vrf: SVCS
          unicast_routing: true
          subnets:
            - ip: 192.168.21.1/24
              public: true
          l3outs:
            - L3OUT-SDWAN-SVCS

      contracts:
        - name: CT-SVCS-PERMIT-ANY
          scope: context
          subjects:
            - name: SUBJ-PERMIT-ANY
              filters:
                - filter: default
                  action: permit

      l3outs:
        - name: L3OUT-SDWAN-SVCS
          vrf: SVCS
          domain: ROUTED1
          import_route_control_enforcement: true
          export_route_control_enforcement: true
          nodes:
            - node_id: 102
              router_id: 10.255.100.102
              interfaces:
                - port: 1
                  vlan: 3020
                  ip: 10.100.20.1/30
                  bgp_peers:
                    - ip: 10.100.20.2
                      remote_as: 65200
                      local_as: 65100
                      admin_state: true
                      unicast_address_family: true
                      send_community: true
                      send_ext_community: true
          external_endpoint_groups:
            - name: EXT-EPG-SVCS
              subnets:
                - prefix: 0.0.0.0/0
                  import_route_control: true
                  export_route_control: true
                  aggregate_import_route_control: true
                  aggregate_export_route_control: true
                  import_security: true
              contracts:
                consumers:
                  - CT-SVCS-PERMIT-ANY
                providers:
                  - CT-SVCS-PERMIT-ANY

      application_profiles:
        - name: SVCS
          endpoint_groups:
            - name: EPG-Shared
              bridge_domain: BD-Shared
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-SVCS-PERMIT-ANY
                providers:
                  - CT-SVCS-PERMIT-ANY
              static_ports:
                - node_id: 101
                  port: 4
                  vlan: 40

            - name: EPG-DB
              bridge_domain: BD-DB
              physical_domains:
                - PHYSICAL1
              contracts:
                consumers:
                  - CT-SVCS-PERMIT-ANY
                providers:
                  - CT-SVCS-PERMIT-ANY
