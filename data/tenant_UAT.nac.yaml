---
apic:
  tenants:
    - name: COH-NAC-DEMO-UAT

      vrfs:
        - name: UAT

      bridge_domains:
        - name: BD_VLAN40
          vrf: UAT
          subnets:
            - ip: 10.1.40.1/24

        - name: BD_VLAN41
          vrf: UAT
          subnets:
            - ip: 10.1.41.1/24

        - name: BD_VLAN42
          vrf: UAT
          subnets:
            - ip: 10.1.42.1/24

        - name: BD_VLAN43
          vrf: UAT
          subnets:
            - ip: 10.1.43.1/24

        - name: BD_VLAN44
          vrf: UAT
          subnets:
            - ip: 10.1.44.1/24

      application_profiles:
        - name: UAT
          endpoint_groups:
            - name: EPG_VLAN40
              bridge_domain: BD_VLAN40
              physical_domains:
                - PHYSICAL1
              static_ports:
                - node_id: 101
                  port: 4
                  vlan: 40

            - name: EPG_VLAN41
              bridge_domain: BD_VLAN41
              physical_domains:
                - PHYSICAL1

            - name: EPG_VLAN42
              bridge_domain: BD_VLAN42
              physical_domains:
                - PHYSICAL1

            - name: EPG_VLAN43
              bridge_domain: BD_VLAN43
              physical_domains:
                - PHYSICAL1

            - name: EPG_VLAN44
              bridge_domain: BD_VLAN44
              physical_domains:
                - PHYSICAL1
