---
bootstrap_objects:
  - name: Bootstrap
    template: bootstrap
    folder: bootstrap
    paths:
      - apic.bootstrap

objects:
  - name: Config Passphrase
    template: config_passphrase
    folder: fabric_policies
    delete: false
    paths:
      - apic.fabric_policies.config_passphrase
  - name: Control Plane MTU
    template: control_plane_mtu
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.control_plane_mtu
  - name: Date and Time Format
    template: date_time_format
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.date_time_format
  - name: APIC Connectivity Preference
    template: apic_connectivity_pref
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.apic_conn_pref
  - name: GUI and CLI Banner
    template: banner
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.banners
  - name: Atomic Counter
    template: atomic_counter
    folder: fabric_policies
    delete: false
    aci_classes:
      - dbgOngoingAcMode
    test_types:
      - config
    paths:
      - apic.fabric_policies.atomic_counter
  - name: EP Loop Protection
    template: ep_loop_protection
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.ep_loop_protection
  - name: Rogue EP Control
    template: rogue_ep_control
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.rogue_ep_control
  - name: IP Aging
    template: ip_aging
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.ip_aging
  - name: System Global GIPo
    template: system_global_gipo
    folder: fabric_policies
    delete: false
    aci_classes:
      - fmcastSystemGIPoPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.use_infra_gipo
  - name: Fabric Wide Settings
    template: fabric_wide_settings
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.global_settings
  - name: Port Tracking
    template: port_tracking
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.port_tracking
  - name: PTP
    template: ptp
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.ptp
  - name: Fabric ISIS Redistribute Metric
    template: isis_policy
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.fabric_isis_redistribute_metric
  - name: Fabric ISIS BFD
    template: fabric_isis_bfd
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.fabric_isis_bfd
  - name: DNS Profile Policy
    template: dns_policy
    folder: fabric_policies
    aci_classes: dnsProfile
    test_types:
      - config
    paths:
      - apic.fabric_policies.dns_policies
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: Error Disabled Recovery Policy
    template: err_disabled_recovery
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.err_disabled_recovery
  - name: COOP Policy Group
    template: coop_policy
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.coop_group_policy
  - name: L2 MTU
    template: l2_mtu
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.l2_port_mtu
      - apic.fabric_policies.l2_mtu_policies
  - name: Infra DSCP Translation Policy
    template: infra_dscp_translation_policy
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.infra_dscp_translation_policy
  - name: AAA Settings
    template: aaa
    folder: fabric_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.fabric_policies.aaa.remote_user_login_policy
      - apic.fabric_policies.aaa.default_fallback_check
      - apic.fabric_policies.aaa.default_realm
      - apic.fabric_policies.aaa.default_login_domain
      - apic.fabric_policies.aaa.console_realm
      - apic.fabric_policies.aaa.console_login_domain
      - apic.fabric_policies.aaa.management_settings
      - apic.fabric_policies.aaa.security_domains
  - name: TACACS Provider
    template: tacacs
    folder: fabric_policies
    test_types:
      - config
      - health
    aci_classes:
      - aaaTacacsPlusProvider
    paths:
      - apic.fabric_policies.aaa.tacacs_providers
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: RADIUS Provider
    template: radius
    folder: fabric_policies
    test_types:
      - config
      - health
    aci_classes:
      - aaaRadiusProvider
    paths:
      - apic.fabric_policies.aaa.radius_providers
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: LDAP
    template: ldap
    folder: fabric_policies
    test_types:
      - config
      - health
    aci_classes:
      - aaaLdapProvider
      - aaaLdapGroupMapRule
      - aaaLdapGroupMap
    paths:
      - apic.fabric_policies.aaa.ldap
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: User
    template: user
    folder: fabric_policies
    idempotent: false
    test_types:
      - config
    aci_classes:
      - aaaUser
    delete_ignore:
      - admin
      - "{{ apic_username }}"
      - "{{ apic_test_username | default() }}"
      - "{{ apic_ndo_username | default() }}"
    paths:
      - apic.fabric_policies.aaa.users
  - name: Login Domain
    template: login_domain
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - aaaLoginDomain
      - aaaTacacsPlusProviderGroup
      - aaaRadiusProviderGroup
      - aaaLdapProviderGroup
    delete_ignore: fallback
    paths:
      - apic.fabric_policies.aaa.login_domains
  - name: Remote Location
    template: remote_location
    folder: fabric_policies
    test_types:
      - config
      - health
    aci_classes:
      - fileRemotePath
    paths:
      - apic.fabric_policies.remote_locations
  - name: Scheduler
    template: scheduler
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - trigSchedP
    delete_ignore:
      - ConstCatSchedP
      - ConstSchedP
      - EveryEightHours
    paths:
      - apic.fabric_policies.schedulers
  - name: Config Exports
    template: config_export
    folder: fabric_policies
    test_types:
      - config
      - health
      - operational
    aci_classes:
      - configExportP
    delete_ignore: DailyAutoBackup
    paths:
      - apic.fabric_policies.config_exports
  - name: SNMP Trap
    template: snmp_trap
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - snmpGroup
    paths:
      - apic.fabric_policies.monitoring.snmp_traps
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: Syslog
    template: syslog
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - syslogGroup
    paths:
      - apic.fabric_policies.monitoring.syslogs
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: Monitoring Policy
    template: monitoring_policy
    folder: fabric_policies
    match_dn: 'uni/fabric/moncommon.*|uni/fabric/monfab-.*'
    test_types:
      - config
    aci_classes:
      - monCommonPol
      - monFabricPol
    paths:
      - apic.fabric_policies.monitoring.policies
  - name: CA Certificate
    template: ca_cert
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - pkiTP
    paths:
      - apic.fabric_policies.aaa.ca_certificates
  - name: Keyring
    template: keyring
    folder: fabric_policies
    test_types:
      - config
    aci_classes:
      - pkiKeyRing
    paths:
      - apic.fabric_policies.aaa.key_rings
  - name: Health Score Evaluation
    template: health_score_evaluation
    folder: fabric_policies
    delete: false
    test_types:
      - config
    aci_classes:
      - healthEvalP
    paths:
      - apic.fabric_policies.ignore_acked_faults
  - name: System Performance
    template: system_performance
    delete: false
    folder: fabric_policies
    test_types:
      - config
    paths:
      - apic.fabric_policies.system_performance
  - name: MACsec Fabric Parameters Policy
    template: macsec_parameters_policy
    folder: fabric_policies
    aci_classes:
      - macsecFabParamPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.macsec_parameters_policies
  - name: MACsec Fabric Keychain Policy
    template: macsec_keychain_policy
    folder: fabric_policies
    aci_classes:
      - macsecKeyChainPol
    match_dn: 'uni\/fabric\/macsecpcontfab\/keychainp-.*'
    test_types:
      - config
    paths:
      - apic.fabric_policies.macsec_keychain_policies
  - name: MACsec Fabric Interfaces Policy
    template: macsec_interfaces_policy
    folder: fabric_policies
    aci_classes:
      - macsecFabIfPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.macsec_interfaces_policies
  - name: MCP Global Instance
    template: mcp
    folder: access_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.access_policies.mcp
  - name: QOS Class
    template: qos
    folder: access_policies
    delete: false
    test_types:
      - config
    paths:
      - apic.access_policies.qos
  - name: Pod Setup
    template: pod_setup
    folder: pod_policies
    aci_classes:
      - fabricSetupP
    delete_ignore: 1
    delete_ignore_attr: podId
    test_types:
      - config
      - health
    paths:
      - apic.pod_policies.pods
  - name: Node Registration
    template: node_registration
    folder: node_policies
    aci_classes:
      - fabricNodeIdentP
    test_types:
      - config
    paths:
      - apic.node_policies.nodes.role
      - apic.node_policies.nodes.set_role
      - apic.node_policies.nodes.serial_number
      - apic.node_policies.nodes.name
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.pod
      - apic.node_policies.nodes.type
      - apic.node_policies.nodes.remote_pool_id
      - apic.node_policies.nodes.expected_state
      - apic.node_policies.expected_state
  - name: OOB Node Address
    template: oob_node_address
    folder: node_policies
    aci_classes:
      - mgmtRsOoBStNode
    test_types:
      - config
    paths:
      - apic.node_policies.nodes.oob_address
      - apic.node_policies.nodes.oob_gateway
      - apic.node_policies.nodes.oob_v6_address
      - apic.node_policies.nodes.oob_v6_gateway
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.nodes.pod
  - name: INB Node Address
    template: inb_node_address
    folder: node_policies
    aci_classes:
      - mgmtRsInBStNode
    test_types:
      - config
    paths:
      - apic.node_policies.nodes.inb_address
      - apic.node_policies.nodes.inb_gateway
      - apic.node_policies.nodes.inb_v6_address
      - apic.node_policies.nodes.inb_v6_gateway
    diff_paths:
      - apic.node_policies.inb_endpoint_group
      - apic.node_policies.nodes.pod
  - name: Maintenance Group
    template: maintenance_group
    folder: node_policies
    aci_classes:
      - maintMaintP
      - maintMaintGrp
    test_types:
      - config
    paths:
      - apic.node_policies.update_groups
      - apic.node_policies.nodes.update_group
    diff_paths:
      - apic.node_policies.nodes.id
  - name: Firmware Group
    template: firmware_group
    folder: node_policies
    aci_classes:
      - firmwareFwP
      - firmwareFwGrp
    test_types:
      - config
    paths:
      - apic.node_policies.update_groups
      - apic.node_policies.nodes.update_group
    diff_paths:
      - apic.node_policies.nodes.id
  - name: VPC Group
    template: vpc_group
    folder: node_policies
    aci_classes:
      - fabricExplicitGEp
    test_types:
      - config
    paths:
      - apic.node_policies.vpc_groups
  - name: RBAC Node Rule
    template: rbac_node_rule
    folder: node_policies
    aci_classes:
      - aaaRbacNodeRule
    test_types:
      - config
    paths:
      - apic.node_policies.nodes.security_domains
    diff_paths:
      - apic.node_policies.nodes.id
  - name: Date and Time Policy
    template: date_time_policy
    folder: fabric_policies
    aci_classes:
      - datetimePol
    test_types:
      - config
      - health
    paths:
      - apic.fabric_policies.pod_policies.date_time_policies
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: BGP Policy
    template: bgp_policy
    folder: fabric_policies
    aci_classes:
      - bgpInstPol
    test_types:
      - config
      - operational
    paths:
      - apic.fabric_policies.fabric_bgp_rr
      - apic.fabric_policies.fabric_bgp_ext_rr
      - apic.fabric_policies.fabric_bgp_as
  - name: Fabric Leaf Switch Profile
    template: fp_leaf_switch_profile
    folder: fabric_policies
    aci_classes:
      - fabricLeafP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_fabric_leaf_switch_interface_profiles
      - apic.fabric_policies.leaf_switch_profile_name
      - apic.fabric_policies.leaf_switch_selector_name
      - apic.fabric_policies.leaf_interface_profile_name
      - apic.fabric_policies.leaf_switch_profiles
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.name
      - apic.node_policies.nodes.fabric_policy_group
  - name: Fabric Spine Switch Profile
    template: fp_spine_switch_profile
    folder: fabric_policies
    aci_classes:
      - fabricSpineP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_fabric_spine_switch_interface_profiles
      - apic.fabric_policies.spine_switch_profile_name
      - apic.fabric_policies.spine_switch_selector_name
      - apic.fabric_policies.spine_interface_profile_name
      - apic.fabric_policies.spine_switch_profiles
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.name
      - apic.node_policies.nodes.fabric_policy_group
  - name: Fabric Leaf Interface Profile
    template: fp_leaf_interface_profile
    folder: fabric_policies
    aci_classes:
      - fabricLePortP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_fabric_leaf_switch_interface_profiles
      - apic.fabric_policies.leaf_interface_profile_name
      - apic.fabric_policies.leaf_interface_profiles
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.name
  - name: Fabric Spine Interface Profile
    template: fp_spine_interface_profile
    folder: fabric_policies
    aci_classes:
      - fabricSpPortP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_fabric_spine_switch_interface_profiles
      - apic.fabric_policies.spine_interface_profile_name
      - apic.fabric_policies.spine_interface_profiles
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.name
  - name: Pod Profile
    template: pod_profile
    folder: fabric_policies
    aci_classes:
      - fabricPodP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_pod_profiles
      - apic.fabric_policies.pod_profile_name
      - apic.fabric_policies.pod_profile_pod_selector_name
      - apic.fabric_policies.pod_profiles
      - apic.pod_policies.pods.id
      - apic.pod_policies.pods.policy
  - name: SNMP Pod Policy
    template: snmp_policy
    folder: fabric_policies
    aci_classes:
      - snmpPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.pod_policies.snmp_policies
    diff_paths:
      - apic.node_policies.oob_endpoint_group
      - apic.node_policies.inb_endpoint_group
  - name: Management Access Policy
    template: management_access_policy
    folder: fabric_policies
    aci_classes:
      - commPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.pod_policies.management_access_policies
  - name: PSU Switch Policy
    template: psu_policy
    folder: fabric_policies
    aci_classes:
      - psuInstPol
    test_types:
      - config
    paths:
      - apic.fabric_policies.switch_policies.psu_policies
  - name: Node Control Switch Policy
    template: node_control_policy
    folder: fabric_policies
    aci_classes:
      - fabricNodeControl
    test_types:
      - config
    paths:
      - apic.fabric_policies.switch_policies.node_control_policies
  - name: Pod Policy Group
    template: pod_policy_group
    folder: fabric_policies
    aci_classes:
      - fabricPodPGrp
    test_types:
      - config
    paths:
      - apic.fabric_policies.pod_policy_groups
  - name: Fabric Leaf Switch Policy Group
    template: fp_leaf_switch_policy_group
    folder: fabric_policies
    aci_classes:
      - fabricLeNodePGrp
    test_types:
      - config
    paths:
      - apic.fabric_policies.leaf_switch_policy_groups
  - name: Fabric Spine Switch Policy Group
    template: fp_spine_switch_policy_group
    folder: fabric_policies
    aci_classes:
      - fabricSpNodePGrp
    test_types:
      - config
    paths:
      - apic.fabric_policies.spine_switch_policy_groups
  - name: Leaf Fabric Port Policy Group
    template: fp_leaf_interface_policy_group
    folder: fabric_policies
    aci_classes:
      - fabricLePortPGrp
    test_types:
      - config
    paths:
      - apic.fabric_policies.leaf_interface_policy_groups
  - name: External Connectivity Policy
    template: ext_conn_policy
    folder: fabric_policies
    aci_classes:
      - fvFabricExtConnP
    test_types:
      - config
      - health
    paths:
      - apic.fabric_policies.external_connectivity_policy
      - apic.pod_policies.pods.id
      - apic.pod_policies.pods.data_plane_tep
  - name: Nutanix VMM Domain
    template: ntnx_vmm_domain
    folder: fabric_policies
    aci_classes:
      - vmmDomP
    match_attribute: mode
    match_attribute_value: "nutanix_pc"
    test_types:
      - config
    paths:
      - apic.fabric_policies.nutanix_vmm_domains
  - name: VMware VMM Domain
    template: vmw_vmm_domain
    folder: fabric_policies
    aci_classes:
      - vmmDomP
    match_attribute: mode
    match_attribute_value: "default"
    test_types:
      - config
      - health
    paths:
      - apic.fabric_policies.vmware_vmm_domains
    diff_paths:
      - apic.node_policies.inb_endpoint_group
  - name: Geolocation Policy
    template: geolocation
    folder: fabric_policies
    aci_classes:
      - geoSite
    test_types:
      - config
    paths:
      - apic.fabric_policies.geolocation
  - name: Fabric SPAN Source Group
    template: fp_span_source_group
    folder: fabric_policies
    aci_classes:
      - spanSrcGrp
    match_dn: 'uni\/fabric.*'
    test_types:
      - config
      - health
    paths:
      - apic.fabric_policies.span.source_groups
  - name: Fabric SPAN Destination Group
    template: fp_span_destination_group
    folder: fabric_policies
    aci_classes:
      - spanDestGrp
    match_dn: 'uni\/fabric.*'
    test_types:
      - config
      - health
    paths:
      - apic.fabric_policies.span.destination_groups
  - name: Interface Type
    template: interface_type
    folder: fabric_policies
    delete: false
    aci_classes:
      - infraRsPortDirection
    test_types:
      - config
    paths:
      - apic.interface_policies.nodes.interfaces.type
  - name: Interface Shutdown
    template: interface_shutdown
    folder: fabric_policies
    aci_classes:
      - fabricRsOosPath
    test_types:
      - config
    paths:
      - apic.interface_policies.nodes.interfaces.shutdown
      - apic.interface_policies.nodes.interfaces.sub_ports.shutdown
      - apic.interface_policies.nodes.fexes.interfaces.shutdown
  - name: Access Leaf Switch Profile
    template: ap_leaf_switch_profile
    folder: access_policies
    aci_classes:
      - infraNodeP
    test_types:
      - config
      - health
    paths:
      - apic.auto_generate_switch_pod_profiles
      - apic.auto_generate_access_leaf_switch_interface_profiles
      - apic.access_policies.leaf_switch_profile_name
      - apic.access_policies.leaf_switch_selector_name
      - apic.access_policies.leaf_interface_profile_name
      - apic.access_policies.leaf_switch_profiles
      - apic.node_policies.nodes.id
      - apic.node_policies.nodes.name
      - apic.node_policies.nodes.access_policy_group
  - name: Access Spine Switch Profile
    template: ap_spine_switch_profile
    folder: access_policies
    aci_classes:
      - infraSpineP
    test_types:
      - config
      - health
    paths:
