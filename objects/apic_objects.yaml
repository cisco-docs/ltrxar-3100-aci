    delete_ignore:
      - copy
      - inb
      - oob
    scope:
      - user
      - mgmt
    test_types:
      - config
      - health
    paths:
      - apic.tenants.vrfs
  - name: VXLAN VRF Stretch
    template: vxlan_vrf_stretch
    folder: tenants
    aci_classes:
      - l3extOut
    match_dn: 'uni\/tn-%%TENANT%%\/out-vxlan_vrf_.*'
    scope:
      - user
    test_types:
      - config
    paths:
      - apic.tenants.vrfs.vxlan_stretch
  - name: Bridge Domain
    template: bridge_domain
    folder: tenants
    aci_classes:
      - fvBD
    delete_ignore:
      - inb
    scope:
      - user
      - mgmt
    test_types:
      - config
      - health
    paths:
      - apic.tenants.bridge_domains
  - name: L3out
    template: l3out
    folder: tenants
    aci_classes:
      - l3extOut
    match_dn: 'uni\/tn-%%TENANT%%\/out-.*'
